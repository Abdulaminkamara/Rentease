<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold page-head">Admin Dashboard</h2>
                <a href="admin-users.html" class="btn btn-outline-primary">
                    <i class="bi bi-people"></i> Manage Users
                </a>
            </div>

            <div class="row g-4 mb-5" id="stats-cards"></div>

            <div id="moderation-wrap" class="mb-4"></div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Recent Users</h5>
                        </div>
                        <ul class="list-group list-group-flush" id="recent-users"></ul>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Recent Properties</h5>
                        </div>
                        <ul class="list-group list-group-flush" id="recent-properties"></ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/admin.js"></script>
</body>
</html>
