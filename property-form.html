<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Add Property | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-section">
                        <h3 class="fw-bold mb-4" id="form-title">Add New Property</h3>
                        <form id="property-form" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label" for="f-title">Property Title</label>
                                <input type="text" class="form-control" id="f-title" required maxlength="200">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="f-description">Description</label>
                                <textarea class="form-control" id="f-description" rows="4" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label" for="f-address">Address</label>
                                    <input type="text" class="form-control" id="f-address" required maxlength="255">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-pincode">Community / Area</label>
                                    <input type="text" class="form-control" id="f-pincode" maxlength="10" placeholder="e.g. Wilberforce, Lumley">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="f-city">City</label>
                                    <input type="text" class="form-control" id="f-city" required maxlength="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="f-state">State</label>
                                    <input type="text" class="form-control" id="f-state" required maxlength="100">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-price">Monthly Rent (Nle)</label>
                                    <input type="number" class="form-control" id="f-price" min="1" step="any" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-type">Property Type</label>
                                    <select class="form-select" id="f-type">
                                        <option value="apartment">Apartment</option>
                                        <option value="house">House</option>
                                        <option value="room">Room / PG</option>
                                        <option value="villa">Villa</option>
                                        <option value="studio">Studio</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-status">Status</label>
                                    <select class="form-select" id="f-status">
                                        <option value="available">Available (Publish)</option>
                                        <option value="pending">Pending Review</option>
                                        <option value="inactive">Inactive (Hide)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-bedrooms">Bedrooms</label>
                                    <input type="number" class="form-control" id="f-bedrooms" min="0" max="20" value="1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-bathrooms">Bathrooms</label>
                                    <input type="number" class="form-control" id="f-bathrooms" min="1" max="20" value="1" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="f-area">Area (sq.ft)</label>
                                    <input type="number" class="form-control" id="f-area" min="1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="f-amenities">Amenities (comma separated)</label>
                                <textarea class="form-control" id="f-amenities" rows="2" placeholder="e.g. WiFi, Parking, AC, Gym, Lift, Security"></textarea>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="f-furnished">
                                <label class="form-check-label" for="f-furnished">Furnished</label>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="f-images">Property Images</label>
                                <input type="file" class="form-control" id="f-images" accept="image/*" multiple>
                                <div class="form-text">You can select multiple images (JPG, PNG, WEBP, GIF).</div>
                                <div class="d-flex flex-wrap gap-2 mt-2" id="image-preview"></div>
                            </div>
                            <div class="text-danger small mb-3" id="form-error"></div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="save-button">Save Property</button>
                                <a href="landlord-dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/property-form.js"></script>
</body>
</html>
