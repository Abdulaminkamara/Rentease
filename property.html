<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | RentEase</title>
    <meta name="description" content="Browse verified rental properties in Sierra Leone with RentEase – search, request and manage rentals online.">
    <meta property="og:title" content="RentEase – Property Details">
    <meta property="og:description" content="Browse verified rental properties in Sierra Leone with RentEase.">
    <meta property="og:image" content="https://images.pexels.com/photos/15691650/pexels-photo-15691650.jpeg?auto=compress&cs=tinysrgb&w=800">
    <meta property="og:url" content="property.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RentEase – Property Details">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4" id="property-page">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm mb-4">
                        <div id="prop-carousel-wrap"></div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h2 class="fw-bold" id="p-title"></h2>
                                    <p class="text-muted" id="p-location"></p>
                                </div>
                                <span id="p-status"></span>
                            </div>
                            <h3 class="price-tag mb-3" id="p-price"></h3>

                            <div class="row text-center mb-4" id="p-specs"></div>

                            <h5>Description</h5>
                            <p id="p-description"></p>

                            <div id="p-amenities"></div>

                            <p class="mt-3"><strong id="p-furnished"></strong></p>
                            <p class="text-muted small" id="p-listed-by"></p>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 id="reviews-heading">Reviews</h5>
                            <div id="reviews-list"></div>
                            <div id="review-form-wrap"></div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                <div id="booking-sidebar"></div>
                <div id="report-box"></div>
            </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@28.0.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/appwrite.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/property-detail.js"></script>
</body>
</html>
