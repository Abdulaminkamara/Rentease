<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                <h2 class="fw-bold page-head mb-0">Manage Users</h2>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary" id="export-users-csv"><i class="bi bi-download"></i> Export CSV</button>
                    <a href="admin-dashboard.html" class="btn btn-outline-primary">Back to Dashboard</a>
                </div>
            </div>
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="users-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@28.0.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/appwrite.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/admin.js"></script>
</body>
</html>
