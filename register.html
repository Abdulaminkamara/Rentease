<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="form-section">
                        <h3 class="text-center mb-4 fw-bold">Create Account</h3>
                        <form id="register-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="r-username">Username</label>
                                    <input type="text" class="form-control" id="r-username" required minlength="3" maxlength="80">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="r-fullname">Full Name</label>
                                    <input type="text" class="form-control" id="r-fullname" required maxlength="120">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="r-email">Email</label>
                                <input type="email" class="form-control" id="r-email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="r-phone">Phone Number</label>
                                <input type="tel" class="form-control" id="r-phone" maxlength="20">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="r-role">Register As</label>
                                <select class="form-select" id="r-role">
                                    <option value="tenant">Tenant (Looking for property)</option>
                                    <option value="landlord">Landlord (List property)</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="r-password">Password</label>
                                    <input type="password" class="form-control" id="r-password" required minlength="8">
                                    <div class="form-text">At least 8 characters (Appwrite requirement).</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="r-confirm">Confirm Password</label>
                                    <input type="password" class="form-control" id="r-confirm" required>
                                </div>
                            </div>
                            <div class="text-danger small mb-3" id="register-error"></div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        <p class="text-center mt-3 mb-0">
                            Already have an account? <a href="login.html">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/auth.js"></script>
</body>
</html>
