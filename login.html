<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="form-section">
                        <h3 class="text-center mb-4 fw-bold">Login to RentEase</h3>
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                <div class="text-danger small" id="email-error"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                <div class="text-danger small" id="password-error"></div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Remember Me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="text-center mt-3 mb-0">
                            Don't have an account? <a href="register.html">Register here</a>
                        </p>
                        <hr>
                        <p class="text-muted small text-center mb-2"><strong>Demo accounts:</strong></p>
                        <ul class="text-muted small mb-0">
                            <li>Admin: admin@demo.com / admin123</li>
                            <li>Landlord: landlord@demo.com / landlord123</li>
                            <li>Tenant: tenant@demo.com / tenant123</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@28.0.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/appwrite.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/auth.js"></script>
</body>
</html>
