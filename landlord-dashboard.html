<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord Dashboard | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold page-head">Landlord Dashboard</h2>
                <a href="property-form.html" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Add Property
                </a>
            </div>

            <div class="row g-4 mb-4" id="landlord-stats"></div>

            <div id="pending-bookings-wrap"></div>

            <div id="active-rentals-wrap"></div>

            <div id="landlord-notifications"></div>

            <h4 class="mb-3" id="my-properties-heading"></h4>
            <div class="row g-4" id="my-properties"></div>
        </div>
    </main>

    <div class="modal fade" id="record-payment-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-cash-stack"></i> Record Rent Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Only record a payment when the money has actually been received. Rent status is derived from recorded receipts only.</p>
                    <form id="record-payment-form">
                        <input type="hidden" id="pay-rental-id">
                        <div class="mb-3">
                            <label class="form-label" for="pay-amount">Amount Received (Nle)</label>
                            <input type="number" class="form-control" id="pay-amount" min="1" step="any" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pay-period-start">Covers Period Starting</label>
                            <input type="date" class="form-control" id="pay-period-start" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pay-reference">Reference (optional)</label>
                            <input type="text" class="form-control" id="pay-reference" maxlength="120" placeholder="e.g. DBBANK transfer ref, cash receipt no.">
                        </div>
                        <div class="text-danger small mb-2" id="pay-error"></div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Record Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@28.0.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/appwrite.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/landlord.js"></script>
</body>
</html>
