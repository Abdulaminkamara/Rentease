<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Properties | RentEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav id="site-nav"></nav>

    <main>
        <div class="container my-4">
            <h2 class="fw-bold page-head mb-4">Browse Properties</h2>

            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form method="GET" class="row g-3" id="search-form">
                        <div class="col-md-3">
                            <input type="text" name="keyword" id="f-keyword" class="form-control" placeholder="Keyword...">
                        </div>
                        <div class="col-md-2">
                            <input type="text" name="city" id="f-city" class="form-control" placeholder="City">
                        </div>
                        <div class="col-md-2">
                            <select name="property_type" id="f-type" class="form-select">
                                <option value="">All Types</option>
                                <option value="apartment">Apartment</option>
                                <option value="house">House</option>
                                <option value="room">Room / PG</option>
                                <option value="villa">Villa</option>
                                <option value="studio">Studio</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select name="bedrooms" id="f-bedrooms" class="form-select">
                                <option value="">Any Bedrooms</option>
                                <option value="1">1+</option>
                                <option value="2">2+</option>
                                <option value="3">3+</option>
                                <option value="4">4+</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" name="min_price" id="f-min" class="form-control" placeholder="Min Nle">
                        </div>
                        <div class="col-md-2">
                            <input type="number" name="max_price" id="f-max" class="form-control" placeholder="Max Nle">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                        <div class="col-md-1">
                            <a href="properties.html" class="btn btn-outline-secondary w-100" title="Clear filters">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-4" id="property-list"></div>
            <nav class="mt-4" id="pagination"></nav>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@28.0.0"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/appwrite.js"></script>
    <script src="static/js/store.js"></script>
    <script src="static/js/main.js"></script>
    <script src="static/js/properties.js"></script>
</body>
</html>
